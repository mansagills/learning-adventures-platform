name: Beta CI — Test & QA

on:
  push:
    branches:
      - 'beta/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Placeholder config, mirroring the build job below. These are fake values
    # for a CI runner with no Supabase project — never real credentials.
    #
    # NOTE: this does NOT fix any currently-failing test. Without it the API
    # route tests die at "supabaseUrl is required", which masks their real
    # problem: they mock @/lib/prisma and bcryptjs but not the Supabase client,
    # so the signup route attempts a live auth request and fails with
    # "AuthRetryableFetchError: fetch failed". They were written against the
    # pre-Supabase signup flow. Setting config here just lets them fail for
    # their actual reason instead of a misleading one.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/testdb?sslmode=disable"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/testdb?sslmode=disable"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --reporter=verbose

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/testdb?sslmode=disable"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/testdb?sslmode=disable"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build
