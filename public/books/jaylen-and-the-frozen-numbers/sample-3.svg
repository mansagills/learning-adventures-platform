<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Jaylen and the Frozen Numbers, sample page 3 of 3: On the number line, the 7 would not hop to 8. The pizza fractions would not slice. And far down the hall, a cold voice whispered, “Stay still. Stay still forever.”">
  <title>Jaylen and the Frozen Numbers, sample page 3 of 3: On the number line, the 7 would not hop to 8. The pizza fractions would not slice. And far down the hall, a cold voice whispered, “Stay still. Stay still forever.”</title>
