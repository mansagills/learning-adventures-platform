  <text font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="34" fill="#1E293B">
<tspan x="660" y="236">On the number line, the</tspan>
<tspan x="660" y="282">7 would not hop to 8.</tspan>
<tspan x="660" y="328">The pizza fractions</tspan>
<tspan x="660" y="374">would not slice. And far</tspan>
<tspan x="660" y="420">down the hall, a cold</tspan>
<tspan x="660" y="466">voice whispered, “Stay</tspan>
<tspan x="660" y="512">still. Stay still</tspan>
<tspan x="660" y="558">forever.”</tspan>
  </text>
