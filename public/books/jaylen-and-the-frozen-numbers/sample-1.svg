<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Jaylen and the Frozen Numbers, sample page 1 of 3: On the very first morning at the Academy, the clock tower forgot how to count. Its hands stood still at three o'clock, and every number on its face had turned a frosty gray.">
  <title>Jaylen and the Frozen Numbers, sample page 1 of 3: On the very first morning at the Academy, the clock tower forgot how to count. Its hands stood still at three o'clock, and every number on its face had turned a frosty gray.</title>
  <rect width="1200" height="800" fill="#FFFDF5"/>
  <!-- Illustration page (placeholder art) -->
  <rect x="24" y="24" width="572" height="752" rx="28" fill="#8B5CF6"/>
  <circle cx="500" cy="130" r="120" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="110" cy="660" r="90" fill="#FFFFFF" opacity="0.14"/>
  <rect x="380" y="560" width="120" height="120" rx="24" transform="rotate(14 440 620)" fill="#FFFFFF" opacity="0.16"/>
  <circle cx="310" cy="390" r="170" fill="#FFFFFF" opacity="0.22"/>
  <text x="310" y="450" font-size="170" text-anchor="middle">🕰️</text>
  <text x="310" y="736" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.9">Illustration coming soon</text>
  <!-- Gutter -->
  <rect x="598" y="24" width="4" height="752" fill="#1E293B" opacity="0.08"/>
  <!-- Text page -->
  <rect x="604" y="24" width="572" height="752" rx="28" fill="#EDE9FE"/>
  <text font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="34" fill="#1E293B">
<tspan x="660" y="236">On the very first</tspan>
<tspan x="660" y="282">morning at the Academy,</tspan>
<tspan x="660" y="328">the clock tower forgot</tspan>
<tspan x="660" y="374">how to count. Its hands</tspan>
<tspan x="660" y="420">stood still at three</tspan>
<tspan x="660" y="466">o'clock, and every</tspan>
<tspan x="660" y="512">number on its face had</tspan>
<tspan x="660" y="558">turned a frosty gray.</tspan>
  </text>
  <text x="890" y="736" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Sample page 1 of 3</text>
</svg>
